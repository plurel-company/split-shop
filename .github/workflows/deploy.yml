name: Deploy storefront to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-split-shop
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_PLUREL_MERCHANT_ID: ${{ vars.NEXT_PUBLIC_PLUREL_MERCHANT_ID }}
      NEXT_PUBLIC_PLUREL_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_PLUREL_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_PLUREL_PUBLISHABLE_KEY_TEST: ${{ vars.NEXT_PUBLIC_PLUREL_PUBLISHABLE_KEY_TEST }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm deploy
