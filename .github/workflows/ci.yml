name: Cloudflare CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:cloudflare
      - run: pnpm exec wrangler deploy --dry-run
      - run: node scripts/smoke-cloudflare.mjs
      - run: pnpm build:integrated
      - run: pnpm test:integrated
      - uses: actions/upload-artifact@v4
        with:
          name: demo-shop-handoff
          path: dist
