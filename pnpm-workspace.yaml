packages:
  - .

overrides:
  "@plurel/react-sdk>@plurel/sdk": "1.2.1"

# pnpm 10.26+ / 11: explicit allow list for dependency install scripts.
allowBuilds:
  "@sentry/cli": true
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@plurel/react-sdk@1.2.1'
  - '@plurel/sdk@1.2.1'
# Compatibility for pnpm versions before allowBuilds.
onlyBuiltDependencies:
  - "@sentry/cli"
  - esbuild
  - sharp
  - workerd
  - "@plurel/react-sdk"
  - "@plurel/sdk"
